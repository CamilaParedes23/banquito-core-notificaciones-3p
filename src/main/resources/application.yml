server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT}
          timeout: ${SMTP_TIMEOUT}
          writetimeout: ${SMTP_WRITE_TIMEOUT}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE}

springdoc:
  api-docs:
    path: ${OPENAPI_DOCS_PATH}
  swagger-ui:
    path: ${SWAGGER_UI_PATH}

banquito:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
  grpc:
    server:
      port: ${NOTIFICATION_GRPC_PORT}
  notification:
    delivery:
      mode: ${NOTIFICATION_DELIVERY_MODE}
      provider: ${NOTIFICATION_PROVIDER}
      from: ${SMTP_FROM}
      reply-to: ${SMTP_REPLY_TO}
