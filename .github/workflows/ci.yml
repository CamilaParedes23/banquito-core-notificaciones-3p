name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMIN_DB_URL: jdbc:mysql://127.0.0.1:3306/core_administrador_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil
      ADMIN_DB_USER: test
      ADMIN_DB_PASSWORD: test

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: core_administrador_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utest -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B -V -T 1C clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
